@if (isVisible()) {
<div
  class="w-full max-w-md bg-white rounded-lg shadow-lg border-l-4 transition-all duration-300 ease-in-out transform"
  [class.border-green-500]="alert().type === 'success'"
  [class.border-red-500]="alert().type === 'error'"
  [class.border-yellow-500]="alert().type === 'warning'"
  [class.border-blue-500]="alert().type === 'info'"
  [class.translate-y-0]="isVisible()"
  [class.opacity-100]="isVisible()"
  [class.translate-y-[-100%]]="!isVisible()"
  [class.opacity-0]="!isVisible()"
>
  <div class="p-4">
    <div class="flex items-start gap-3">
      <div class="flex-shrink-0">
        <!-- Success Icon -->
        @if (alert().type === 'success') {
        <div
          class="w-6 h-6 bg-green-100 rounded-full flex items-center justify-center"
        >
          <svg
            class="w-4 h-4 text-green-600"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </div>
        }

        <!-- Error Icon -->
        @if (alert().type === 'error') {
        <div
          class="w-6 h-6 bg-red-100 rounded-full flex items-center justify-center"
        >
          <svg
            class="w-4 h-4 text-red-600"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </div>
        }

        <!-- Warning Icon -->
        @if (alert().type === 'warning') {
        <div
          class="w-6 h-6 bg-yellow-100 rounded-full flex items-center justify-center"
        >
          <svg
            class="w-4 h-4 text-yellow-600"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </div>
        }

        <!-- Info Icon -->
        @if (alert().type === 'info') {
        <div
          class="w-6 h-6 bg-blue-100 rounded-full flex items-center justify-center"
        >
          <svg
            class="w-4 h-4 text-blue-600"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </div>
        }
      </div>

      <div class="flex-1 min-w-0 pr-2">
        <p
          class="text-sm font-semibold"
          [class.text-green-800]="alert().type === 'success'"
          [class.text-red-800]="alert().type === 'error'"
          [class.text-yellow-800]="alert().type === 'warning'"
          [class.text-blue-800]="alert().type === 'info'"
        >
          {{ alert().title }}
        </p>
        @if (alert().message) {
        <p class="mt-1 text-sm text-gray-600 leading-relaxed">
          {{ alert().message }}
        </p>
        }
      </div>

      @if (alert().showCloseButton !== false) {
      <div class="flex-shrink-0">
        <button
          type="button"
          class="bg-white rounded-md p-1 text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors"
          (click)="close()"
        >
          <span class="sr-only">Close</span>
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </button>
      </div>
      }
    </div>
  </div>
</div>
}
