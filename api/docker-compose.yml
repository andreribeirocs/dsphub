version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dsphub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsphub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    networks:
      - dsphub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsphub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for session storage (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: dsphub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dsphub_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prisma Studio (optional - for database management UI)
  prisma-studio:
    image: node:18-alpine
    container_name: dsphub_prisma_studio
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    networks:
      - dsphub_network
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npx prisma studio --hostname 0.0.0.0"
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  dsphub_network:
    driver: bridge

